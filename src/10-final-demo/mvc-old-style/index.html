<main class="projectile-card">
  <h1 class="projectile-title">Projectile MVC</h1>

  <div class="projectile-controls">
    <label>
      Speed: <span id="speed-value">25 m/s</span>
      <input id="speed-input" type="range" min="10" max="80" value="25" />
    </label>

    <label>
      Angle: <span id="angle-value">45°</span>
      <input id="angle-input" type="range" min="10" max="80" value="45" />
    </label>

    <label>
      Height: <span id="height-value">0 m</span>
      <input id="height-input" type="range" min="0" max="20" value="0" />
    </label>
  </div>

  <canvas id="projectile-canvas" width="1000" height="450" class="projectile-canvas"></canvas>

  <button id="reset-button" class="projectile-reset-button">Reset</button>
</main>

<script defer type="module" src="./main.js"></script>
